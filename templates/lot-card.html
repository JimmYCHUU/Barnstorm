<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carbarn lot card</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* Lot card, 1080x1080, approved 1 Nov 2026. One car per picture.
     Photo with logo, grade badge and pill; Carbarn Blue bar with hook, then model + features beside the km pill. */
  .card{grid-template-rows:736px 1fr}
  .bar{padding:36px 48px 40px;display:grid;align-content:center;min-width:0;overflow:hidden}
  .hook{font:900 74px/1 var(--f);letter-spacing:-.015em;white-space:nowrap;overflow:hidden}
  .info{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:22px;min-width:0}
  .meta{min-width:0;flex:1}
  .model{font:800 36px/1.15 var(--f);white-space:nowrap;overflow:hidden}
  .feat{font:600 26px/1.3 var(--f);color:var(--label);margin-top:10px;white-space:nowrap;overflow:hidden}
  .ig .card{grid-template-rows:864px 1fr}
  .ig .bar{padding:56px 56px 80px}
  .ig .hook{font-size:108px;line-height:1.04;white-space:normal;text-wrap:balance}
  .ig .hook .nb{white-space:nowrap}
  .ig .info{margin-top:40px}
  .ig .model{font-size:40px}
  .ig .feat{font-size:28px;margin-top:12px}
</style>
<script src="shared.js"></script>
</head>
<body>
<div class="card" id="card"></div>
<script>
  // card = {market:{logo,brand,lang}, photo:{src,focus,zoom,blur}, slots:{hook,model,feat,km|chip,grade,pill,pillTone}}
  window.draw = async function (card) {
    const s = card.slots, e = window.esc;
    document.documentElement.lang = card.market.lang || 'en';
    const el = document.getElementById('card');
    el.innerHTML = `
      <div class="photo" id="stage">
        ${card.photo.fit === 'contain' ? `<img class="back" src="${e(card.photo.src)}" alt="">` : ''}<img class="car" src="${e(card.photo.src)}" alt="${e(s.model)}">
        <img class="logo" src="../assets/logos/${e(card.market.logo)}" alt="${e(card.market.brand)}">
        ${s.grade ? `<div class="grade"><small>GRADE</small><b>${e(s.grade)}</b></div>` : ''}
        ${s.pill ? `<span class="pill ${s.pillTone === 'stock' ? 'stock' : ''}"><i></i>${e(s.pill)}</span>` : ''}
      </div>
      <div class="bar" data-box="bar">
        <div class="hook" data-fit="hook">${e(s.hook).replace(/\S+-\S+/g, '<span class="nb">$&</span>')}</div>
        <div class="info">
          <div class="meta"><div class="model" data-fit="model">${e(s.model)}</div><div class="feat" data-fit="feat">${e(s.feat)}</div></div>
          <span class="chip">${e(s.chip ?? s.km)}</span>
        </div>
      </div>`;
    await window.finish(await window.placePhoto(document.getElementById('stage'), card.photo));
  };
</script>
</body>
</html>
